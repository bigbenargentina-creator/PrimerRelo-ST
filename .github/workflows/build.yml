name: Build APK Claudia
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o RelojSideralWidget.zip
          rm RelojSideralWidget.zip
          if [! -f gradlew ]; then
            for d in */; do
              if [ -f "$d/gradlew" ]; then
                cp -r $d/*. 2>/dev/null || true
                cp -r $d/.*. 2>/dev/null || true
                break
              fi
            done
          fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RelojSideral-APK
          path: app/build/outputs/apk/debug/*.apk
