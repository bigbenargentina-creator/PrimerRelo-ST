name: Build APK Claudia
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip RelojSideralWidget.zip
          rm RelojSideralWidget.zip
          mv *Widget*/*. 2>/dev/null || true
          mv RelojSideralWidget/*. 2>/dev/null || true
          ls -la
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RelojSideral-Claudia-APK
          path: app/build/outputs/apk/debug/*.apk
